{{define "content"}}
<div class="page-head">
    <div>
        <p class="crumbs"><a href="{{.Back}}">Back</a></p>
        <h1>Lesson deleted</h1>
        <p class="muted">{{.DeletedLesson.Title}}{{if .DeletedLesson.PersonName}} for {{.DeletedLesson.PersonName}}{{end}}</p>
    </div>
</div>

<section class="panel deletion-undo-panel">
    <h2>Want it back?</h2>
    <p>This lesson and its files can be restored for seven days.</p>
    <form method="post" action="/lessons/restore">
        <input type="hidden" name="token" value="{{.DeletedLesson.Token}}">
        <input type="hidden" name="back" value="{{.Back}}">
        <button type="submit">Undo deletion</button>
    </form>
    <a class="muted" href="{{.Back}}">Continue without restoring</a>
</section>
{{end}}
