{{define "layout"}}<!doctype html>
<html lang="en" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>School Nanny</title>
    <script>
        // Settle the theme before the stylesheet paints, otherwise the page
        // flashes the wrong one. Kept inline and tiny for that reason. The
        // data-theme above is the fallback for a browser with scripting off.
        (function () {
            var mode = "auto";
            try {
                var saved = localStorage.getItem("school-nanny-theme");
                if (saved === "light" || saved === "dark") { mode = saved; }
            } catch (e) { /* private browsing: fall back to automatic */ }
            var dark = mode === "dark" || (mode === "auto" &&
                window.matchMedia("(prefers-color-scheme: dark)").matches);
            document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
            document.documentElement.setAttribute("data-theme-mode", mode);
        })();
    </script>
    <link rel="stylesheet" href="/static/pico.min.css">
    <link rel="stylesheet" href="/static/app.css">
    <script src="/static/htmx.min.js" defer></script>
    <script src="/static/theme.js" defer></script>
    <script src="/static/ui.js" defer></script>
</head>
<body>
<header class="app-bar">
    <div class="app-bar-inner">
        <a href="/" class="brand">School&nbsp;Nanny</a>
        <nav class="app-nav">
            <a href="/" class="{{if eq .Active "home"}}current{{end}}">Today</a>
            <a href="/planner" class="{{if eq .Active "planner"}}current{{end}}">Week</a>
            <a href="/curriculum" class="{{if eq .Active "curriculum"}}current{{end}}">Curriculum</a>
            <a href="/attendance" class="{{if eq .Active "attendance"}}current{{end}}">Attendance</a>
            <a href="/archive" class="{{if eq .Active "archive"}}current{{end}}">Archive</a>
            {{range .NavKids}}
                <a href="/kids/{{.ID}}" class="nav-kid">
                    <span class="dot" style="background:{{color .Color}}"></span>{{.Name}}
                </a>
            {{end}}
            <a href="/settings" class="{{if eq .Active "settings"}}current{{end}}">Settings</a>
            {{if .HasPassword}}
                <form method="post" action="/logout" class="inline-form">
                    <button class="link-button" type="submit">Lock</button>
                </form>
            {{end}}
            <button type="button" class="theme-toggle" data-theme-toggle data-mode="auto"
                    title="Switch between automatic, light, and dark">
                <svg class="icon-auto" viewBox="0 0 24 24" width="15" height="15"
                     fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <circle cx="12" cy="12" r="9"/>
                    <path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/>
                </svg>
                <svg class="icon-light" viewBox="0 0 24 24" width="15" height="15"
                     fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="4.5"/>
                    <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>
                </svg>
                <svg class="icon-dark" viewBox="0 0 24 24" width="15" height="15"
                     fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linejoin="round" aria-hidden="true">
                    <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/>
                </svg>
                <span data-theme-label>Auto</span>
            </button>
        </nav>
    </div>
</header>

<main class="page">
    {{template "content" .}}
</main>
</body>
</html>
{{end}}
