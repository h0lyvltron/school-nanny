; Hosts that can run School Nanny.
;
; The development machine is also the server for now. The Ryzen box is the
; planned home for it, and is commented out until it exists; the point of the
; playbook is that moving there should be an inventory change rather than a
; second set of instructions.

[hosted]
localhost ansible_connection=local

; ryzen ansible_host=192.168.1.182 ansible_user=timbo

[hosted:vars]
ansible_python_interpreter=/usr/bin/python3
