; Hosts that can run School Nanny.
;
; The development machine is also the server for now. Uncomment Ryzen when that
; box is ready; cutover steps are in docs/RYZEN_CUTOVER.md.

[hosted]
localhost ansible_connection=local

; ryzen ansible_host=192.168.1.182 ansible_user=timbo

[hosted:vars]
ansible_python_interpreter=/usr/bin/python3

; Optional public VPS — see docs/PUBLIC_VPS.md
; [vps]
; vps ansible_host=203.0.113.10 ansible_user=deploy
